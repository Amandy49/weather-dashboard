spring:
  application:
    name: weather-dashboard
  datasource:
    url: jdbc:mysql://localhost:3306/weather_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080
  servlet:
    context-path: /api

# Weather API Configuration
weather:
  api:
    key: 9f4b93d9204ee365e4aeb34407a64db9
    endpoint: https://api.openweathermap.org/data/2.5
    timeout: 10000

logging:
  level:
    root: INFO
    com.weather: DEBUG
